name: Bike final
on:
  pull_request:
  push:
    branches: [dev, staging, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.1
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.make_fixture
      - run: docker build -t bike:ci .
      - run: docker run -d --name bike-ci -e APP_ENV=ci -p 127.0.0.1:18200:8000 bike:ci
      - run: python -m scripts.smoke --url http://127.0.0.1:18200
      - if: always()
        run: docker rm -f bike-ci || true
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.ENABLE_CD == 'true'
    needs: [tests, quality, image-build]
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'dvc[azure]==3.67.1'
      - name: Restore selected model and create staging env
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          APP_MESSAGE: ${{ secrets.APP_MESSAGE }}
          APP_ENV: staging
        run: python -m scripts.prepare_release
      - run: docker build -t bike:staging .
      - run: docker run -d --name bike-stage --env-file runtime/deploy.env -p 127.0.0.1:18201:8000 bike:staging
      - run: python -m scripts.smoke --url http://127.0.0.1:18201
      - if: always()
        run: |
          docker rm -f bike-stage || true
          rm -f runtime/deploy.env .dvc/config.local
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    needs: [tests, quality, image-build]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'dvc[azure]==3.67.1'
      - name: Restore selected model and create production env
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          APP_MESSAGE: ${{ secrets.APP_MESSAGE }}
          APP_ENV: production
        run: python -m scripts.prepare_release
      - run: docker build -t bike:production .
      - if: always()
        run: rm -f runtime/deploy.env .dvc/config.local
